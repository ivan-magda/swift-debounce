name: Documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time: a deploy that started finishes, and only the newest waiting run follows it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # xcodebuild docbuild needs no swift-docc-plugin, so the root manifest stays free of dependencies.
      - name: Build documentation
        run: |
          xcodebuild docbuild \
            -scheme swift-debounce-Package \
            -destination "generic/platform=macOS" \
            -derivedDataPath .derivedData

          # One site for both modules: /documentation/debounce/ and /documentation/debounceswiftui/,
          # with a landing page at /documentation/ that links to both.
          archives=.derivedData/Build/Products/Debug
          docc=$(xcrun --find docc)
          "$docc" merge "$archives/Debounce.doccarchive" "$archives/DebounceSwiftUI.doccarchive" \
            --synthesized-landing-page-name swift-debounce \
            --output-path Combined.doccarchive
          "$docc" process-archive transform-for-static-hosting Combined.doccarchive \
            --hosting-base-path swift-debounce \
            --output-path ./docs

      - name: Add redirect
        run: |
          cat > ./docs/index.html << 'EOF'
          <!DOCTYPE html><html><head>
            <meta http-equiv="refresh" content="0; url=documentation/">
          </head></html>
          EOF

      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
