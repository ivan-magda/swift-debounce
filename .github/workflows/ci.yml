name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run per branch or pull request: a new push cancels the run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apple:
    name: Apple platforms (latest Xcode)
    runs-on: macos-latest
    # A normal run takes under 10 minutes; a stuck simulator would otherwise hold the runner for hours.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Check the root manifest
        run: scripts/check-manifest.sh

      - name: Test
        run: swift test

      - name: Test with Thread Sanitizer
        run: swift test --sanitize=thread

      - name: Build for iOS, tvOS, watchOS, visionOS
        run: |
          for platform in iOS tvOS watchOS visionOS; do
            xcodebuild build -quiet -scheme swift-debounce-Package -destination "generic/platform=$platform"
          done

      - name: Pick an iPhone simulator
        run: |
          udid=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          print(next(d["udid"] for runtime, ds in devices.items() if "iOS" in runtime for d in ds if d["name"].startswith("iPhone")))')
          echo "SIMULATOR=$udid" >> "$GITHUB_ENV"

      # `swift test` on macOS can't drive SwiftUI updates, so the modifier's end-to-end tests run
      # with real views on the iOS Simulator.
      - name: Test the SwiftUI modifier on the iOS Simulator
        # Not -quiet: it hides which expectation failed.
        run: xcodebuild test -scheme swift-debounce-Package -destination "id=$SIMULATOR" -only-testing:DebounceSwiftUITests

      - name: Run the README examples on the iOS Simulator
        working-directory: Examples
        run: xcodebuild test -quiet -scheme DebounceExamples-Package -destination "id=$SIMULATOR"

      - name: Build the benchmarks
        run: swift build -c release --package-path Benchmarks

  minimum-toolchain:
    name: Swift 6.0 (Xcode 16), minimum deployment targets
    runs-on: macos-15
    # A normal run takes under 10 minutes; a stuck simulator would otherwise hold the runner for hours.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      # The Swift 6.0 compiler builds and tests every target. A macOS build needs no extra platform,
      # so Xcode 16.0 works as installed on the runner.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.0'

      - name: Test
        run: swift test

      # xcodebuild needs a platform's simulator runtime even for a generic device build. On
      # macos-15 only Xcode 16.4 among 16.x has them installed (16.0 to 16.3 ship with
      # "install_runtimes": "none"). It has the same deployment-target floor as 16.0, while newer
      # Xcode versions raise the targets silently (iOS 15, watchOS 9, ...).
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Build for the minimum iOS, tvOS, watchOS, visionOS
        run: |
          for platform in iOS tvOS watchOS visionOS; do
            xcodebuild build -quiet -scheme swift-debounce-Package -destination "generic/platform=$platform"
          done

  linux:
    name: Linux (${{ matrix.swift }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        swift: ['6.0', 'latest']
    container: swift:${{ matrix.swift }}
    steps:
      - uses: actions/checkout@v6
      - name: Test
        run: swift test
